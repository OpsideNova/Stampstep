# Compile l'application Android de Stampstep et publie l'APK en téléchargement.
# Lancement : onglet « Actions » du dépôt GitHub → « Application Android » → « Run workflow ».
# L'adresse du serveur est dans mobile/capacitor.config.json (https://stampstep.com).
# Pour en changer sans toucher au fichier : Settings → Secrets and variables → Actions →
# Variables → STAMPSTEPS_URL.
name: Application Android

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Adresse du serveur
        env:
          URL: ${{ vars.STAMPSTEPS_URL }}
        run: |
          if [ -n "$URL" ]; then
            node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('capacitor.config.json'));c.server.url=process.env.URL.replace(/\/$/,'');fs.writeFileSync('capacitor.config.json',JSON.stringify(c,null,2))"
          fi
          grep '"url"' capacitor.config.json

      - name: Dépendances
        run: npm install

      - name: Icône et écran de démarrage
        continue-on-error: true
        run: npm run icones

      - name: Synchronisation Capacitor
        run: npx cap sync android

      - name: Compilation de l'APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renommer
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Stampstep.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Stampstep-android
          path: mobile/Stampstep.apk
          retention-days: 30
